  ctx.restore();
}

/* ------------------------------------------------------------------ */
/*  screens                                                            */
/* ------------------------------------------------------------------ */
function drawMenu() {
  ctx.fillStyle = "rgba(4,6,12,0.55)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";

  ctx.save();
  ctx.font = "900 96px Consolas, monospace";
  const g = ctx.createLinearGradient(0, H * 0.18, 0, H * 0.40);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.45, "#ff2f7a");
  g.addColorStop(1, "#ffb02e");
  ctx.fillStyle = g;
  ctx.shadowColor = "#ff2f7a";
  ctx.shadowBlur = 42;
  ctx.fillText("NEON RUSH", W / 2, H * 0.34);
  ctx.restore();

  ctx.font = "600 17px Consolas, monospace";
  ctx.fillStyle = "#9fe8ff";
  ctx.fillText("неоновый танк • гонка на 4 круга • полиция • беспредел", W / 2, H * 0.40);

  const cw = 560;
  const bx = W / 2 - cw / 2;
  ctx.fillStyle = "rgba(8,12,24,0.55)";
  rr(bx, H * 0.46, cw, 146, 14); ctx.fill();
  ctx.strokeStyle = "rgba(34,240,255,0.25)";
  ctx.lineWidth = 1;
  rr(bx + 0.5, H * 0.46 + 0.5, cw - 1, 145, 14); ctx.stroke();

  ctx.font = "700 15px Consolas, monospace";
  ctx.textAlign = "left";
  const rows = [
    ["←  →  /  A  D", "руль"],
    ["↑  W", "газ"],
    ["↓  S", "тормоз"],
    ["SPACE / SHIFT", "нитро"],
    ["F  /  J  /  CTRL", "огонь"],
    ["P / ESC", "пауза"],
    ["M", "звук"]
  ];
  rows.forEach(function (r, i) {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const x = bx + 30 + col * 270;
    const y = H * 0.46 + 28 + row * 30;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(r[0], x, y);
    ctx.fillStyle = "#6f8ba3";
    ctx.fillText(r[1], x + 175, y);
  });

  const a = 0.55 + 0.45 * Math.sin(elapsed * 4);
  ctx.globalAlpha = a;
  ctx.textAlign = "center";
  ctx.font = "800 24px Consolas, monospace";
  ctx.fillStyle = "#22f0ff";
  ctx.shadowColor = "#22f0ff";
  ctx.shadowBlur = 18;
  ctx.fillText(isTouch ? "КОСНИСЬ ЭКРАНА — СТАРТ" : "НАЖМИ ENTER — СТАРТ", W / 2, H * 0.76);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  ctx.font = "700 14px Consolas, monospace";
  ctx.fillStyle = "#ff9ec4";
  ctx.fillText("РЕКОРД: " + fmt(best), W / 2, H * 0.84);
}

function drawOver() {
  ctx.fillStyle = "rgba(4,6,12,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  ctx.save();
  ctx.font = "900 72px Consolas, monospace";
  ctx.fillStyle = "#ff2f6a";
  ctx.shadowColor = "#ff2f6a";
  ctx.shadowBlur = 36;
  ctx.fillText(raceFinished ? "ФИНИШ!" : "ЗАЕЗД ОКОНЧЕН", W / 2, H * 0.28);
  ctx.restore();

  ctx.font = "700 15px Consolas, monospace";
  ctx.fillStyle = raceFinished ? "#ffd23f" : "#9fe8ff";
  ctx.fillText(raceFinished ? ("МЕСТО " + finalPlace + " ИЗ " + (rivals.length + 1)) : "ВРЕМЯ ВЫШЛО", W / 2, H * 0.34);

  ctx.font = "900 64px Consolas, monospace";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(fmt(score), W / 2, H * 0.50);

  ctx.font = "700 15px Consolas, monospace";
  ctx.fillStyle = "#7fd6ff";
  ctx.fillText("ОЧКИ", W / 2, H * 0.545);

  ctx.font = "700 17px Consolas, monospace";
  ctx.fillStyle = "#ffd23f";
  let statsLine = "ОБГОНОВ: " + passedCars + "     УНИЧТОЖЕНО: " + kills + "     ДИСТАНЦИЯ: " + (distance / SEGLEN / 10).toFixed(1) + " км";
  if (raceFinished) statsLine += "     БОНУС: +" + fmt(finishBonus);
  ctx.fillText(statsLine, W / 2, H * 0.62);

  ctx.fillStyle = "#ffffff";
  ctx.font = "800 20px Consolas, monospace";
  ctx.fillStyle = finalPlace === 1 ? "#ffd23f" : "#9fe8ff";
  ctx.fillText("МЕСТО В ГОНКЕ: " + finalPlace + " / " + (rivals.length + 1), W / 2, H * 0.67);

  ctx.fillStyle = "#ffffff";
  ctx.font = "700 17px Consolas, monospace";
  ctx.fillText("РЕКОРД: " + fmt(best), W / 2, H * 0.73);

  const a = 0.5 + 0.5 * Math.sin(elapsed * 4);
  ctx.globalAlpha = a;
  ctx.font = "800 24px Consolas, monospace";
  ctx.fillStyle = "#22f0ff";
  ctx.fillText(isTouch ? "КОСНИСЬ — ЕЩЁ РАЗ" : "ENTER — ЕЩЁ РАЗ", W / 2, H * 0.80);
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = "rgba(4,6,12,0.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.font = "900 64px Consolas, monospace";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("ПАУЗА", W / 2, H / 2);
  ctx.font = "700 18px Consolas, monospace";
  ctx.fillStyle = "#9fe8ff";
  ctx.fillText("P / ESC — продолжить", W / 2, H / 2 + 44);
}

function drawCountdown() {
  const c = Math.ceil(countdown);
  const frac = 1 - (countdown - Math.floor(countdown));
  ctx.save();
  ctx.textAlign = "center";
  ctx.globalAlpha = clamp(1 - frac * 0.35, 0, 1);
  ctx.font = "900 " + (110 + frac * 40) + "px Consolas, monospace";
  ctx.fillStyle = c <= 1 ? "#3dff7a" : "#ffd23f";
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 40;
  ctx.fillText(c > 0 ? String(c) : "GO", W / 2, H * 0.46);
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.3, W / 2, H * 0.55, H * 0.95);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------------ */
/*  render                                                             */
/* ------------------------------------------------------------------ */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  let sx = 0, sy = 0;
  if (shake > 0) {
    sx = rnd(-1, 1) * 9 * shake;
    sy = rnd(-1, 1) * 7 * shake;
  }

  const baseSeg = findSegment(position);
  const basePct = (position % SEGLEN) / SEGLEN;
  const playerSeg = findSegment(position + PLAYERZ);
  const playerPct = ((position + PLAYERZ) % SEGLEN) / SEGLEN;
  const pY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
  playerY = pY;

  drawBackground(bgShift * 60 + playerX * 80, pY);

  ctx.save();
  ctx.translate(sx, sy);

  // карта машин по сегментам
  const carMap = new Map();
  for (const car of cars) {
    if (car.dead) continue;
    const idx = findSegment(car.z).index;
    let arr = carMap.get(idx);
    if (!arr) { arr = []; carMap.set(idx, arr); }
    arr.push(car);
  }

  // карта соперников по сегментам
  const rivalMap = new Map();
  if (state !== "menu") {
    for (const r of rivals) {
      if (r.dead) continue;
      const idx = findSegment(r.z).index;
      let arr = rivalMap.get(idx);
      if (!arr) { arr = []; rivalMap.set(idx, arr); }
      arr.push(r);
    }
  }

  // карта снарядов по сегментам
  const shellMap = new Map();
  for (const sh of shells) {
    const idx = findSegment(sh.z).index;
    let arr = shellMap.get(idx);
    if (!arr) { arr = []; shellMap.set(idx, arr); }
    arr.push(sh);
  }

  // карта полиции / денег / бочек
  const copMap = new Map();
  for (const c of cops) {
    if (c.dead) continue;
    const idx = findSegment(c.z).index;
    let arr = copMap.get(idx);
    if (!arr) { arr = []; copMap.set(idx, arr); }
    arr.push(c);
  }
  const pickupMap = new Map();
  for (const p of pickups) {
    const idx = findSegment(p.z).index;
    let arr = pickupMap.get(idx);
    if (!arr) { arr = []; pickupMap.set(idx, arr); }
    arr.push(p);
  }
  const barrelMap = new Map();
  for (const b of barrels) {
    if (b.hit) continue;
    const idx = findSegment(b.z).index;
    let arr = barrelMap.get(idx);
    if (!arr) { arr = []; barrelMap.set(idx, arr); }
    arr.push(b);
  }

  let maxy = H;
  let x = 0;
  let dx = -(baseSeg.curve * basePct);

  for (let n = 0; n < DRAWDIST; n++) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.clip = maxy;
    seg.drawn = false;
    seg.projected = false;
    seg.fog = clamp((n / DRAWDIST - 0.25) / 0.75, 0, 1) * 0.95;

    const camZ = position - (seg.looped ? trackLength : 0);
    project(seg.p1, playerX * ROADW - x, pY + CAMH, camZ);
    project(seg.p2, playerX * ROADW - x - dx, pY + CAMH, camZ);
    x += dx;
    dx += seg.curve;

    if (seg.p1.camera.z <= CAMD) continue;
    seg.projected = true;

    if (seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    seg.drawn = true;
    renderSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
                  seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w,
                  seg.fog, COLORS[seg.color] || COLORS.light);
    maxy = seg.p1.screen.y;
  }

  // Спрайты (машины, столбы) — отдельным проходом от дальних к ближним.
  // Рисуем их для всех спроецированных сегментов (как в эталонном racer'е),
  // иначе машины на гребнях и перевалах бесследно исчезают.
  for (let n = DRAWDIST - 1; n >= 1; n--) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    if (!seg.projected) continue;
    if (!isFinite(seg.p1.screen.x) || !isFinite(seg.p1.screen.y) || !isFinite(seg.clip)) continue;

    const alpha = clamp(1 - seg.fog * 1.05, 0, 1);
    if (alpha < 0.04) continue;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, Math.max(0, seg.clip + 1));
    ctx.clip();
    ctx.globalAlpha = alpha;

    if (seg.index % 12 === 0 && seg.p1.screen.w > 6) {
      const margin = seg.p1.screen.w * 0.04;
      drawPole(seg.p1.screen.x - seg.p1.screen.w - margin, seg.p1.screen.y, seg.p1.screen.w);
      drawPole(seg.p1.screen.x + seg.p1.screen.w + margin, seg.p1.screen.y, seg.p1.screen.w);
    }

    const list = carMap.get(seg.index);
    if (list) for (const car of list) drawCarSprite(car, seg);

    const rlist = rivalMap.get(seg.index);
    if (rlist) for (const r of rlist) drawRivalSprite(r, seg);

    const clist = copMap.get(seg.index);
    if (clist) for (const c of clist) drawCopSprite(c, seg);

    const plist = pickupMap.get(seg.index);
    if (plist) for (const p of plist) drawPickup(p, seg);

    const blist = barrelMap.get(seg.index);
    if (blist) for (const b of blist) drawBarrel(b, seg);

    const shots = shellMap.get(seg.index);
    if (shots) for (const sh of shots) drawShellSprite(sh, seg);

    ctx.restore();
  }

  drawSpeedLines();

  if (state !== "menu" && state !== "over") {
    drawPlayer();
  }

  drawParticles();
  drawBooms();

  // вспышка чекпоинта
  if (flash > 0) {
    ctx.fillStyle = "rgba(34,240,255," + (flash * 0.22) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  drawVignette();

  if (state === "race" || state === "ready" || state === "paused") drawHUD();
  if (state === "ready") drawCountdown();
  if (state === "menu") drawMenu();
  if (state === "over") drawOver();
  if (state === "paused") drawPaused();

  // подсказка для тача
  if (isTouch && state === "race") {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 40px Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText("◀", W * 0.22, H * 0.78);
    ctx.fillText("▶", W * 0.78, H * 0.78);
    ctx.font = "700 13px Consolas, monospace";
    ctx.fillText("НИТРО", W * 0.87, H * 0.63);
    ctx.restore();

    // кнопка огня
    const fb = FIRE_BTN;
    const k = input.fire ? 1 : 0.5;
    const ready = gunCooldown <= 0;
    ctx.save();
    const fg = ctx.createRadialGradient(fb.x, fb.y, 0, fb.x, fb.y, fb.r);
    fg.addColorStop(0, "rgba(255,110,50," + (0.30 * k) + ")");
    fg.addColorStop(1, "rgba(255,47,106,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,180,90," + (0.35 + 0.4 * k) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2);
    ctx.stroke();
    if (!ready) {
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(fb.x, fb.y, fb.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - gunCooldown / GUN_COOLDOWN));
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,235,200," + (0.55 + 0.4 * k) + ")";
    ctx.font = "800 14px Consolas, monospace";
    ctx.textAlign = "center";
    ctx.fillText("ОГОНЬ", fb.x, fb.y + 5);
    ctx.restore();
  }
}

/* ------------------------------------------------------------------ */
/*  loop                                                               */
/* ------------------------------------------------------------------ */
let lastT = performance.now();
let acc = 0;
const STEP = 1 / 60;

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  acc += dt;
  while (acc >= STEP) {
    update(STEP);
    acc -= STEP;
  }
  render();
  updateAudio();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
